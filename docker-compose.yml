
services:
  gateway:
    build: ./services/gateway
    ports:
      - "${GATEWAY_PORT_HTTP}:${GATEWAY_PORT_HTTP}"
      - "${GATEWAY_PORT_HTTPS}:${GATEWAY_PORT_HTTPS}"
    networks:
      - fintech-network
    depends_on:
      - auth
    env_file: .env
    volumes:
      - ./services/gateway/nginx.conf.template:/etc/nginx/nginx.conf
      - ./docs/swagger:/usr/share/nginx/html/swagger
  auth:
    build: ./services/auth
    networks:
      - fintech-network
    env_file: .env
    environment:
        PORT: "${AUTH_PORT}"
        DATABASE_URL: "${AUTH_DATABASE_URL}"
        GIN_MODE: "${AUTH_GIN_MODE}"
    volumes:
      - ./services/auth:/app
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    networks:
      - fintech-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
  # swagger-ui:
  #   image: swaggerapi/swagger-ui
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./docs/swagger:/usr/share/nginx/html
networks:
  fintech-network:
    external: true
volumes:
  postgres-data:
