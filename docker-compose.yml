
services:
  gateway:
    build: ./services/gateway
    ports:
      - "${GATEWAY_PORT_HTTP}:${GATEWAY_PORT_HTTP}"
      - "${GATEWAY_PORT_HTTPS}:${GATEWAY_PORT_HTTPS}"
    networks:
      - fintech-network
    depends_on:
      - auth
    env_file: .env

  auth:
    build: ./services/auth
    networks:
      - fintech-network
    env_file: .env
    environment:
        PORT: "${AUTH_PORT}"
        DATABASE_URL: "${AUTH_DATABASE_URL}"
        GIN_MODE: "${AUTH_GIN_MODE}"
    volumes:
      - ./services/auth:/app
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    networks:
      - fintech-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
networks:
  fintech-network:
    external: true
volumes:
  postgres-data:
